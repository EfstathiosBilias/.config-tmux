# ==========================================
# Tmux Configuration - Catppuccin Macchiato Theme
# Matches Neovim (catppuccin-macchiato) & Zsh (Powerlevel10k)
# ==========================================

# -- General Settings --
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Eliminate escape key delay (crucial for Neovim)
set -sg escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Focus events enabled for terminals that support them
set -g focus-events on

# Update status bar every 1 second
set -g status-interval 1

# Set status bar position to top
set -g status-position top

# -- Keybindings --

# Reload tmux config easily with prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf!"

# Set Ctrl+a as the default prefix (easier to reach than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and - (and open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi mode for copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- Catppuccin Macchiato Theme Manual Styling (Robust & Fast) --
# Catppuccin Macchiato Palette:
# base   = #24273a
# mantle = #1e2030
# crust  = #181926
# text   = #cad3f5
# subtext0 = #a5adcb
# overlay0 = #6e738d
# surface0 = #363a4f
# blue   = #8aadf4
# lavender = #b7bdf8
# sapphire = #7dc4e4
# sky    = #91d7e3
# teal   = #8bd5ca
# green  = #a6da95
# yellow = #eed49f
# peach  = #f5a97f
# maroon = #ee99a0
# red    = #ed8796
# mauve  = #c6a0f6
# pink   = #f5bde6

set -g status "on"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Backgrounds and default colors
set -g status-style bg="#24273a",fg="#cad3f5"

# Messages
set -g message-style bg="#363a4f",fg="#cad3f5"
set -g message-command-style bg="#363a4f",fg="#cad3f5"

# Pane borders
set -g pane-border-style fg="#363a4f"
set -g pane-active-border-style fg="#8aadf4"

# Status left (Session name badge)
set -g status-left "#[bg=#8aadf4,fg=#24273a,bold] 󰙯 #S #[bg=#24273a,fg=#8aadf4,nobold]"

# Status right (Modules: date, time, user/host)
set -g status-right "#[fg=#363a4f,bg=#24273a]#[bg=#363a4f,fg=#8aadf4] 󰃰 %Y-%m-%d #[fg=#8aadf4,bg=#363a4f]#[bg=#8aadf4,fg=#24273a,bold] 󱑂 %H:%M:%S #[default]"

# Window status format
setw -g window-status-format "#[fg=#24273a,bg=#363a4f]#[bg=#363a4f,fg=#a5adcb]#I #W #[fg=#363a4f,bg=#24273a]"
setw -g window-status-current-format "#[fg=#24273a,bg=#8aadf4]#[bg=#8aadf4,fg=#24273a,bold] #I #W #[fg=#8aadf4,bg=#24273a]"
setw -g window-status-separator " "

# -- TPM (Tmux Plugin Manager) --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
