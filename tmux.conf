# ==========================================
# Tmux Configuration - Catppuccin Macchiato
# ==========================================

# -- General Settings --
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Eliminate escape key delay for Neovim
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Focus events enabled
set -g focus-events on

# Status bar position at the top
set -g status-position top
set -g status-interval 1

# -- Keybindings --

# Reload tmux config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf!"

# Set Ctrl+a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and - in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi mode for copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- Catppuccin Theme Configuration --
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "application session uptime date_time"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_session_icon "󰙯"

# Pane border styling
set -g @catppuccin_pane_border_style "fg=#363a4f"
set -g @catppuccin_pane_active_border_style "fg=#8aadf4"

# -- TPM (Tmux Plugin Manager) --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
